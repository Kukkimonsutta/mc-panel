services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      NODE_ENV: production
      PORT: 3005
      DOCKER_SOCKET: /var/run/docker.sock
      TARGET_CONTAINER_NAME: ${TARGET_CONTAINER_NAME:-minecraft-server}
      MC_HOST: ${MC_HOST:-minecraft-server}
      RCON_HOST: ${RCON_HOST:-minecraft-server}
      RCON_PORT: ${RCON_PORT:-25575}
      RCON_PASSWORD: ${RCON_PASSWORD:?Set RCON_PASSWORD in .env}
      MC_STATUS_PORT: ${MC_STATUS_PORT:-25565}
      MC_QUERY_PORT: ${MC_QUERY_PORT:-25565}
      HOST_DATA_DIR: /minecraft/minecraft_data
      HOST_COMPOSE_FILE: /minecraft/docker-compose.yml
      BACKUP_DIR: /minecraft/backups
      API_TOKEN: ${API_TOKEN:?Set API_TOKEN in .env}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8081}
      ALLOW_UNSAFE_BACKUP: ${ALLOW_UNSAFE_BACKUP:-0}
      ENABLE_BACKUP_DOWNLOAD: ${ENABLE_BACKUP_DOWNLOAD:-1}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${MINECRAFT_ROOT:?Set MINECRAFT_ROOT in .env}:/minecraft
    group_add:
      - ${DOCKER_SOCKET_GID:-999}
    networks:
      - panel_net
      - minecraft_net
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3005/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_API_TOKEN: ${API_TOKEN:-}
    restart: unless-stopped
    ports:
      - "${PANEL_PORT:-8081}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - panel_net

networks:
  panel_net:
    driver: bridge
  minecraft_net:
    external: true
    name: ${MINECRAFT_NETWORK:?Set MINECRAFT_NETWORK in .env}
